name: GUT Tests

on:
  # Runs on every PR (no path filter) so the required "GUT tests" check
  # always reports; a path-filtered required check would block PRs that
  # don't touch grid-master-app.
  pull_request:
  push:
    # main is tested by the Deploy workflow, which calls this one.
    branches-ignore:
      - main
    paths:
      - 'grid-master-app/**'
  # Lets Deploy run the tests and gate on them.
  workflow_call:

jobs:
  test:
    name: GUT tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Godot
      uses: lihop/setup-godot@v3
      with:
        version: 4.5-stable

    - name: Import Godot project
      run: godot --headless --path grid-master-app --import
    
    - name: Run all GUT suites
      shell: bash
      run: godot --headless --path grid-master-app -s addons/gut/gut_cmdln.gd
