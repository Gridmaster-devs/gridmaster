services:
  builder:
    volumes:
      - type: bind
        source: .
        target: /project
      - type: bind
        source: ./grid-master-app/build
        target: /build
    build:
      context: .
      dockerfile: build.Dockerfile

  editors:
    depends_on:
      - "builder"
    build: 
      context: .
      dockerfile: editors.prod.Dockerfile
    ports: 
      - 8080:80

  client:
    depends_on:
      - "builder"
    build: 
      context: .
      dockerfile: client.Dockerfile
    ports:
      - 8081:80

  server:
    build: 
      context: .
      dockerfile: server.Dockerfile
